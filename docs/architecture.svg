<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="#F9FAFB"/>

  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">GramCare — System Architecture</text>

  <!-- USER -->
  <g filter="url(#shadow)">
    <rect x="40" y="170" width="140" height="90" rx="14" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="110" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">User</text>
    <text x="110" y="226" text-anchor="middle" font-size="12" fill="#6b7280">Patient / Doctor</text>
    <text x="110" y="244" text-anchor="middle" font-size="11" fill="#9ca3af">Browser · Mobile</text>
  </g>

  <!-- FRONTEND -->
  <g filter="url(#shadow)">
    <rect x="240" y="140" width="200" height="160" rx="14" fill="#ffffff" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="240" y="140" width="200" height="32" rx="14" fill="#2563EB"/>
    <rect x="240" y="158" width="200" height="14" fill="#2563EB"/>
    <text x="340" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">FRONTEND</text>
    <text x="340" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">artifacts/telemed</text>
    <text x="340" y="216" text-anchor="middle" font-size="12" fill="#374151">React 18 + Vite</text>
    <text x="340" y="234" text-anchor="middle" font-size="12" fill="#374151">Tailwind · TanStack Query</text>
    <text x="340" y="252" text-anchor="middle" font-size="12" fill="#374151">wouter · i18n (EN/HI)</text>
    <text x="340" y="282" text-anchor="middle" font-size="11" fill="#6b7280">Generated React Query hooks</text>
  </g>

  <!-- BACKEND -->
  <g filter="url(#shadow)">
    <rect x="500" y="140" width="200" height="160" rx="14" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <rect x="500" y="140" width="200" height="32" rx="14" fill="#10B981"/>
    <rect x="500" y="158" width="200" height="14" fill="#10B981"/>
    <text x="600" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BACKEND</text>
    <text x="600" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">artifacts/api-server</text>
    <text x="600" y="216" text-anchor="middle" font-size="12" fill="#374151">Node.js + Express 5</text>
    <text x="600" y="234" text-anchor="middle" font-size="12" fill="#374151">Drizzle ORM · cookie-parser</text>
    <text x="600" y="252" text-anchor="middle" font-size="12" fill="#374151">Demo seeding · Auth middleware</text>
    <text x="600" y="282" text-anchor="middle" font-size="11" fill="#6b7280">REST · /api/*</text>
  </g>

  <!-- POSTGRES -->
  <g filter="url(#shadow)">
    <rect x="760" y="100" width="100" height="80" rx="14" fill="#ffffff" stroke="#E5E7EB"/>
    <ellipse cx="810" cy="118" rx="22" ry="6" fill="none" stroke="#6b7280" stroke-width="1.2"/>
    <path d="M788,118 v22 a22,6 0 0 0 44,0 v-22" fill="none" stroke="#6b7280" stroke-width="1.2"/>
    <text x="810" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">PostgreSQL</text>
  </g>

  <!-- CLERK -->
  <g filter="url(#shadow)">
    <rect x="760" y="220" width="100" height="80" rx="14" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="810" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">Clerk</text>
    <text x="810" y="278" text-anchor="middle" font-size="11" fill="#6b7280">Auth (prod)</text>
  </g>

  <!-- API SPEC (shared) -->
  <g filter="url(#shadow)">
    <rect x="320" y="360" width="240" height="60" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-dasharray="4 3"/>
    <text x="440" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">lib/api-spec  (OpenAPI 3)</text>
    <text x="440" y="404" text-anchor="middle" font-size="11" fill="#1e40af">single source of truth · generates client</text>
  </g>

  <!-- ARROWS -->
  <!-- User <-> Frontend -->
  <line x1="180" y1="215" x2="240" y2="215" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="210" y="206" text-anchor="middle" font-size="10" fill="#6b7280">HTTPS</text>

  <!-- Frontend <-> Backend -->
  <line x1="440" y1="215" x2="500" y2="215" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="470" y="206" text-anchor="middle" font-size="10" fill="#6b7280">/api/*</text>
  <text x="470" y="234" text-anchor="middle" font-size="10" fill="#6b7280">JSON</text>

  <!-- Backend -> Postgres -->
  <line x1="700" y1="180" x2="760" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="735" y="155" text-anchor="middle" font-size="10" fill="#6b7280">SQL</text>

  <!-- Backend -> Clerk -->
  <line x1="700" y1="255" x2="760" y2="258" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="278" text-anchor="middle" font-size="10" fill="#6b7280">verify</text>

  <!-- API spec dashed lines to FE & BE -->
  <line x1="380" y1="360" x2="340" y2="300" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="500" y1="360" x2="600" y2="300" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Legend -->
  <g transform="translate(40,360)">
    <rect width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="22" y="12" font-size="11" fill="#374151">Frontend</text>
    <rect y="22" width="14" height="14" rx="3" fill="#10B981"/>
    <text x="22" y="34" font-size="11" fill="#374151">Backend</text>
    <rect y="44" width="14" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-dasharray="3 2"/>
    <text x="22" y="56" font-size="11" fill="#374151">Shared contract</text>
  </g>
</svg>
