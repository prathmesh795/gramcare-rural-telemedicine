kind = "web"
previewPath = "/"
title = "Rural Telemedicine Portal"
version = "1.0.0"
id = "artifacts/telemed"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20809

[services.development]
run = "pnpm --filter @workspace/telemed run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/telemed", "run", "build" ]
publicDir = "artifacts/telemed/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20809"
BASE_PATH = "/"
